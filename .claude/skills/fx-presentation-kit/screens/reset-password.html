<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nueva Contraseña · Presentation Kit</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="../kit.css" />
    <style>
      body {
        padding: 24px;
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="pk-device mobile">
      <div class="pk-app">
        <div class="pk-main">
          <div class="pk-body center">
            <div class="pk-auth">
              <div class="pk-auth-logo">
                <span class="pk-ico" style="width: 22px; height: 22px"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
              </div>
              <h2>Nueva contraseña</h2>
              <p class="pk-sub">Elige una contraseña segura</p>
              <div class="pk-card">
                <div class="pk-field">
                  <label class="pk-label">Contraseña</label>
                  <input class="pk-input" type="password" placeholder="••••••••" />
                </div>
                <div class="pk-field">
                  <label class="pk-label">Confirmar contraseña</label>
                  <input class="pk-input" type="password" placeholder="••••••••" />
                </div>
                <button class="pk-btn primary block">Restablecer contraseña</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
