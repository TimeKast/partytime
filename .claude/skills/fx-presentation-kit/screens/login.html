<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar Sesión · Presentation Kit</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="../kit.css" />
    <style>
      body {
        padding: 24px;
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="pk-device mobile">
      <div class="pk-app">
        <div class="pk-main">
          <div class="pk-body center">
            <div class="pk-auth">
              <div class="pk-auth-logo">TK</div>
              <h2>Iniciar Sesión</h2>
              <p class="pk-sub">Inicia sesión en tu cuenta</p>
              <div class="pk-card">
                <div class="pk-field">
                  <label class="pk-label">Email</label>
                  <input class="pk-input" type="email" placeholder="tu@email.com" />
                </div>
                <div class="pk-field">
                  <label class="pk-label">Contraseña</label>
                  <div class="pk-input-wrap">
                    <input class="pk-input" type="password" placeholder="••••••••" />
                    <span class="pk-ico"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></span>
                  </div>
                </div>
                <div style="text-align: right; margin-bottom: 14px">
                  <span class="pk-link">¿Olvidaste tu contraseña?</span>
                </div>
                <button class="pk-btn primary block">Iniciar Sesión</button>
              </div>
              <p class="pk-sub" style="margin-top: 16px">
                ¿No tienes cuenta? <span class="pk-link">Regístrate</span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
