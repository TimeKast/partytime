<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear cuenta · Presentation Kit</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="../kit.css" />
    <style>
      body {
        padding: 24px;
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="pk-device mobile">
      <div class="pk-app">
        <div class="pk-main">
          <div class="pk-body center">
            <div class="pk-auth">
              <div class="pk-auth-logo">TK</div>
              <h2>Crear cuenta</h2>
              <p class="pk-sub">Regístrate para empezar</p>
              <div class="pk-card">
                <div class="pk-field">
                  <label class="pk-label">Nombre</label>
                  <input class="pk-input" type="text" placeholder="Tu nombre" />
                </div>
                <div class="pk-field">
                  <label class="pk-label">Email</label>
                  <input class="pk-input" type="email" placeholder="tu@email.com" />
                </div>
                <div class="pk-field">
                  <label class="pk-label">Contraseña</label>
                  <input class="pk-input" type="password" placeholder="••••••••" />
                </div>
                <button class="pk-btn primary block">Crear cuenta</button>
              </div>
              <p class="pk-sub" style="margin-top: 16px">
                ¿Ya tienes cuenta? <span class="pk-link">Inicia sesión</span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
