<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar Contraseña · Presentation Kit</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="../kit.css" />
    <style>
      body {
        padding: 24px;
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="pk-device mobile">
      <div class="pk-app">
        <div class="pk-main">
          <div class="pk-body center">
            <div class="pk-auth">
              <div class="pk-auth-logo">
                <span class="pk-ico" style="width: 22px; height: 22px"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg></span>
              </div>
              <h2>Recuperar Contraseña</h2>
              <p class="pk-sub">Te enviaremos un enlace para restablecerla</p>
              <div class="pk-card">
                <div class="pk-field">
                  <label class="pk-label">Email</label>
                  <input class="pk-input" type="email" placeholder="tu@email.com" />
                </div>
                <button class="pk-btn primary block">Enviar enlace</button>
              </div>
              <p class="pk-sub" style="margin-top: 16px">
                <span class="pk-link">Volver a iniciar sesión</span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
