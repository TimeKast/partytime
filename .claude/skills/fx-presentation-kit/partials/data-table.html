<!-- data-table — DataTable del kit. Última fila .subtotal opcional. .num alinea números. -->
<div class="pk-table-wrap">
  <table class="pk-table">
    <thead>
      <tr>
        <th>Columna</th>
        <th>Estado</th>
        <th class="num">Monto</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Valor</td>
        <td><span class="pk-pill green"><span class="dot"></span>Activo</span></td>
        <td class="num">$1,200</td>
      </tr>
      <tr class="subtotal">
        <td>Total</td>
        <td></td>
        <td class="num">$1,200</td>
      </tr>
    </tbody>
  </table>
</div>
